<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BiliFocus · 学习目录</title><link rel="stylesheet" href="ui.css"></head>
<body data-page="library"><main class="shell block-shell">
<header class="topbar"><div class="brand"><span class="mark">F.</span>BILI / FOCUS</div><span id="timer" class="block-clock">正在检查计时</span></header>
<section class="hero"><p class="eyebrow">STAY WITH YOUR PLAN</p><h1 id="heading">自由切换，仍在计划之内。</h1><p id="description">这里只提供白名单内容，不提供提前退出入口。</p></section>
<div id="notice" class="status-note" role="status" hidden></div>
<section class="card"><div class="section-head"><h2>允许的 UP 主</h2><span id="up-count" class="count"></span></div><p class="help">进入投稿页，自由选看该账号的普通视频。其他账号的内容仍需独立通过白名单校验。</p><div id="up-queue" class="queue"></div></section>
<section class="card section-space"><div class="section-head"><h2>指定视频</h2><span id="count" class="count"></span></div><div id="queue" class="queue"></div></section>
<div class="buttons"><a id="home" class="secondary" href="https://www.bilibili.com/" hidden>返回 B站自由浏览</a></div>
<p class="help">倒计时到时自动结束；正计时需手动结束。随时可在白名单视频页点击「结束学习」，也可在学习空间直接结束。</p>
<footer class="footer">BiliFocus 0.3.2 · 非官方 · 个人专注辅助</footer>
</main><script src="logic.js"></script><script src="ui-common.js"></script><script src="blocked.js"></script></body></html>
